<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Profile Card</title>


    <link rel="stylesheet" href="style.css">


    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>


<body>


    <main>
        <article class="profile-card">


            <img src="Aaysha profile.png" alt="Profile photo of Aaysha Rahmath" class="profile-image">


            <section class="profile-content">


                <h1>Aaysha Rahmath</h1>


                <h2>Business Intelligence Analyst</h2>


                <p>
                    I am currently studying Data science with minor in Marketing, aspiring to become a Business
                    analytics. I am paasionate to explore how a business or brand actually work from software workload
                    to financial literacy.
                </p>


                <nav class="social-links" aria-label="Social media links">
                    <a href="#">GitHub</a>
                    <a href="#">LinkedIn</a>
                    <a href="#">Instagram</a>
                </nav>


            </section>


        </article>
    </main>


</body>


</html>
